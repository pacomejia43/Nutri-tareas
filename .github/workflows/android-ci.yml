name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper jar
        # Not committed as a binary (see .gitignore); regenerated from the same distribution
        # gradle-wrapper.properties already pins, so it's always the exact intended version.
        run: |
          curl -sSL -o /tmp/gradle-bootstrap.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q /tmp/gradle-bootstrap.zip -d /tmp
          /tmp/gradle-8.14.3/bin/gradle wrapper --gradle-version 8.14.3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nutri-tareas-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
